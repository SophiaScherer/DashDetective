# This workflow builds, tests, and publishes the DashDetective Avalonia
# desktop application, which targets .NET (net10.0).
#
# Unlike the stock "WPF/WinForms" desktop template, Avalonia builds entirely
# with the cross-platform `dotnet` CLI and does not use a Windows Application
# Packaging (WAP / .wapproj) project or MSIX signing. The MSBuild/MSIX steps
# from that template have therefore been removed.
#
# The gating job runs on Windows and Linux. Both legs restore, format-check, build
# and test, so a change that only breaks one platform fails the run. Only Windows
# publishes: Linux packaging (RID choice, self-contained vs framework-dependent,
# .desktop file, icons) is deliberately out of scope for now.
#
# A third job builds and tests on macOS, and does NOT gate — see build-macos below.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions

name: .NET Desktop (Avalonia)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the job only reads the repo. upload-artifact needs no extra scope.
permissions:
  contents: read

# One live run per branch. A new push to a pull request cancels the legs still running for the
# previous one; pushes to main are never cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        # macOS runs as its own non-gating job (build-macos) so continue-on-error applies to it
        # alone. Promoting it means deleting that job and adding macos-latest here.
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}  # For a list of available runner types, refer to
                               # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: DashDetective.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install the .NET SDK (must match the project's TargetFramework: net10.0)
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Reuse the downloaded packages across runs. setup-dotnet's own cache: true is not usable here —
    # it wants a packages.lock.json, which this repo does not have — so key on the files that decide
    # what gets restored. A miss still restores; it just costs the download.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    # Restore NuGet dependencies for the solution
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Verify the code is formatted to the repo's .editorconfig (whitespace + import ordering).
    # This fails the run on any unformatted code, so style stays consistent without relying on
    # a reviewer to spot it. Runs after restore and skips its own restore to reuse the one above.
    - name: Verify formatting
      run: dotnet format ${{ env.Solution_Name }} --verify-no-changes --no-restore

    # Build the solution
    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    # Execute all unit tests in the solution and collect code coverage (Cobertura, via coverlet).
    # Runs on both legs: tests that touch the filesystem build their paths through Fakes/TestPaths
    # rather than drive-letter literals, and path identity goes through Shared/PathComparison, so the
    # suite means the same thing on a case-sensitive filesystem. Expect stderr lines from `gio` on
    # ubuntu — the suites that exercise a failed launch point at tools that do not exist, and
    # UseShellExecute hands those to xdg-open instead of throwing. Noise, not failures.
    - name: Execute unit tests
      run: dotnet test ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

    # Upload the coverage report (coverage/**/coverage.cobertura.xml) as a downloadable artifact.
    # Named per OS *and* configuration: all four legs upload now, and a name collision would fail the
    # run outright because if-no-files-found is an error.
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.configuration }}
        path: coverage/**/coverage.cobertura.xml
        if-no-files-found: error

    # Publish the Release build so the compiled app can be downloaded from the run. Windows only —
    # Linux packaging (RID choice, self-contained vs framework-dependent, .desktop file, icons) is a
    # separate piece of work and deliberately out of scope here.
    - name: Publish
      if: matrix.os == 'windows-latest' && matrix.configuration == 'Release'
      run: dotnet publish DashDetective/DashDetective.csproj --configuration Release --no-build --output publish

    # Upload the published output: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      if: matrix.os == 'windows-latest' && matrix.configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: DashDetective-${{ matrix.os }}
        path: publish

  # A reporting leg, not a gate: it proves the code builds and the suite passes on macOS, and claims
  # nothing about macOS support — every ForCurrentPlatform() seam resolves to its Unsupported* arm
  # there. What it watches for is a test assuming "not Windows ⇒ Linux", which the other four legs
  # cannot catch.
  build-macos:

    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    runs-on: macos-latest

    env:
      Solution_Name: DashDetective.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Same shape as the gating job; runner.os is "macOS" here, so it keys its own entry.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Formatting is host-independent, so a failure means the macOS SDK reads .editorconfig differently.
    - name: Verify formatting
      run: dotnet format ${{ env.Solution_Name }} --verify-no-changes --no-restore

    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    # Two things the other legs cannot exercise: PathComparison returns Ordinal while the default APFS
    # volume is case-insensitive, and UseShellExecute hands its target to `open` rather than throwing.
    - name: Execute unit tests
      run: dotnet test ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-macos-latest-${{ matrix.configuration }}
        path: coverage/**/coverage.cobertura.xml
        if-no-files-found: error

    # No publish step: macOS packaging (.app bundle, signing, notarization) is out of scope, as
    # Linux packaging is.
